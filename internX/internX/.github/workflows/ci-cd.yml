name: InternX CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Frontend Build & Quality Gate
  frontend-build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./internx-frontend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: ./internx-frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Frontend Application
        run: npm run build

  # 2. Backend Microservices Build & Testcontainers Integration Suite
  backend-build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./internx-backend
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17 (Eclipse Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build All Microservices & Run Integration Tests
        run: mvn clean test --batch-mode

  # 3. Docker Image Build & Registry Push (on main)
  docker-build:
    needs: [frontend-build, backend-build-and-test]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: actions/docker/setup-buildx-action@v3

      - name: Build Frontend Image
        run: docker build -t internx/frontend:latest ./internx-frontend

      - name: Build Gateway Image
        run: docker build -t internx/api-gateway:latest ./internx-backend/api-gateway

      - name: Build User Service Image
        run: docker build -t internx/user-service:latest ./internx-backend/user-service

      - name: Build Internship Service Image
        run: docker build -t internx/internship-service:latest ./internx-backend/internship-service

      - name: Build Application Service Image
        run: docker build -t internx/application-service:latest ./internx-backend/application-service
