version: '3.8'

services:
  # Infrastructure
  postgres:
    image: postgres:15-alpine
    container_name: internx-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_MULTIPLE_DATABASES: internx_user_db,internx_internship_db,internx_application_db,internx_company_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - internx-net

  redis:
    image: redis:7-alpine
    container_name: internx-redis
    ports:
      - "6379:6379"
    networks:
      - internx-net

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: internx-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - internx-net

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: internx-kafka
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - internx-net

  # Service Discovery
  eureka-server:
    build:
      context: ./internx-backend/eureka-server
    container_name: internx-eureka
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761
    networks:
      - internx-net

  # API Gateway
  api-gateway:
    build:
      context: ./internx-backend/api-gateway
    container_name: internx-gateway
    depends_on:
      - eureka-server
    ports:
      - "8080:8080"
    environment:
      EUREKA_HOST: eureka-server
    networks:
      - internx-net

  # Microservices
  user-service:
    build:
      context: ./internx-backend/user-service
    container_name: internx-user-service
    depends_on:
      - eureka-server
      - postgres
      - redis
      - kafka
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: internx_user_db
      REDIS_HOST: redis
      KAFKA_SERVERS: kafka:9092
      EUREKA_HOST: eureka-server
    networks:
      - internx-net

  internship-service:
    build:
      context: ./internx-backend/internship-service
    container_name: internx-internship-service
    depends_on:
      - eureka-server
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: internx_internship_db
      EUREKA_HOST: eureka-server
    networks:
      - internx-net

  application-service:
    build:
      context: ./internx-backend/application-service
    container_name: internx-application-service
    depends_on:
      - eureka-server
      - postgres
      - kafka
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: internx_application_db
      KAFKA_SERVERS: kafka:9092
      EUREKA_HOST: eureka-server
    networks:
      - internx-net

  company-service:
    build:
      context: ./internx-backend/company-service
    container_name: internx-company-service
    depends_on:
      - eureka-server
      - postgres
    environment:
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: internx_company_db
      EUREKA_HOST: eureka-server
    networks:
      - internx-net

  notification-service:
    build:
      context: ./internx-backend/notification-service
    container_name: internx-notification-service
    depends_on:
      - eureka-server
      - kafka
    environment:
      KAFKA_SERVERS: kafka:9092
      EUREKA_HOST: eureka-server
    networks:
      - internx-net

  # Frontend Web App
  frontend:
    build:
      context: ./internx-frontend
    container_name: internx-frontend
    depends_on:
      - api-gateway
    ports:
      - "3000:80"
    networks:
      - internx-net

networks:
  internx-net:
    driver: bridge

volumes:
  postgres_data:
